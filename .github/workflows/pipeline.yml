name: CI/CD

on:
  push:
    branches:
      - main
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  # Superseded pull request runs are cancelled; runs on main always finish so
  # an image push is never interrupted halfway.
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

env:
  IMAGE: ghcr.io/${{ github.repository }}

jobs:
  validate:
    name: Lint, typecheck, unit test, build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: ./.github/actions/setup

      - name: Lint and format check
        run: pnpm lint

      - name: Tinyrack UI check
        run: pnpm check:ui

      - name: Typecheck
        run: pnpm typecheck

      - name: Unit tests
        run: pnpm test

      - name: Build
        run: pnpm build

      - name: Validate workflows
        run: docker run --rm -v "$PWD:/repo" -w /repo rhysd/actionlint:1.7.12 -color

      - name: Upload build
        uses: actions/upload-artifact@v7.0.2
        with:
          name: dist
          path: dist
          if-no-files-found: error
          retention-days: 7

  e2e:
    name: E2E against a fake Outline
    needs: validate
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: ./.github/actions/setup

      - name: Download build
        uses: actions/download-artifact@v8.0.2
        with:
          name: dist
          path: dist

      - name: Install Chromium
        run: pnpm exec playwright install --with-deps chromium

      - name: Run E2E tests
        run: pnpm test:e2e

      - name: Upload Playwright report
        if: failure()
        uses: actions/upload-artifact@v7.0.2
        with:
          name: playwright-report
          path: |
            playwright-report
            test-results
          retention-days: 7

  image:
    name: Container image
    needs: validate
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7.0.1
      # Node and tsx run the fake Outline for the smoke test.
      - uses: ./.github/actions/setup
      - uses: docker/setup-buildx-action@v4.4.1

      - name: Build image
        uses: docker/build-push-action@v7.4.0
        with:
          context: .
          load: true
          tags: prompter:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max

      # The image must start and serve with a read-only root filesystem, as in Kubernetes.
      - name: Smoke test image
        run: |
          FAKE_OUTLINE_PORT=4320 \
            FAKE_OUTLINE_WEBHOOK_URL=http://127.0.0.1:4319/api/webhooks/outline \
            nohup node --import tsx e2e/fake-outline.ts > fake-outline.log 2>&1 &
          docker run -d --name prompter --network host --read-only --tmpfs /tmp \
            -e PORT=4319 -e OUTLINE_URL=http://127.0.0.1:4320 \
            -e OUTLINE_API_KEY=test-api-key -e OUTLINE_WEBHOOK_SECRET=test-webhook-secret \
            prompter:ci
          for _ in $(seq 1 30); do
            if curl -fsS http://127.0.0.1:4319/healthz >/dev/null 2>&1 \
              && curl -fsS -X POST http://127.0.0.1:4320/__test/health >/dev/null 2>&1; then
              break
            fi
            sleep 2
          done
          id="$(curl -fsS -X POST http://127.0.0.1:4320/__test/documents \
            -H 'Content-Type: application/json' \
            -d '{"title":"Smoke","text":"# Smoke\n\nHello from CI."}' | jq -r .id)"
          curl -fsS "http://127.0.0.1:4319/d/$id" | grep -q 'Hello from CI'
          # A signed webhook from the fake Outline must be accepted.
          status="$(curl -fsS -X POST http://127.0.0.1:4320/__test/edit \
            -H 'Content-Type: application/json' \
            -d "{\"id\":\"$id\",\"text\":\"Edited.\"}" | jq -r .webhookStatus)"
          test "$status" = 204
          docker logs prompter

  publish:
    name: Publish image
    needs:
      - e2e
      - image
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: docker/setup-buildx-action@v4.4.1

      - uses: docker/login-action@v4.8.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - id: metadata
        uses: docker/metadata-action@v6.2.0
        with:
          images: ${{ env.IMAGE }}
          tags: |
            type=raw,value=latest
            type=sha,format=long

      # Flux follows `latest` by digest and rolls the homelab deployment.
      - name: Push image
        uses: docker/build-push-action@v7.4.0
        with:
          context: .
          push: true
          tags: ${{ steps.metadata.outputs.tags }}
          labels: ${{ steps.metadata.outputs.labels }}
          cache-from: type=gha
